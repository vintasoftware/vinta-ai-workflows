packages:
  - 'packages/*'

# pnpm 10 blocks dependency build scripts by default. node-pty is a native
# module and is unusable unless its install script runs. better-sqlite3 is
# native too, but since 13.x its tarball ships a prebuilt binary per platform
# that the package loads directly, and letting pnpm build it only reruns
# node-gyp, which has no compiler to find on a stock Windows runner.
onlyBuiltDependencies:
  - node-pty
ignoredBuiltDependencies:
  - better-sqlite3
