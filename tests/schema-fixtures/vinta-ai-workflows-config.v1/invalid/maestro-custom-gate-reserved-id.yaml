# `codegen` is reserved: it names a plan's codegen steps (`vinta-ai-maestro
# codegen`, the broker's `codegen:` namespace).
schema_version: 1
vinta_ai_workflows_version: 0.7.0-alpha25
project:
  name: acme
  default_branch: main
  code_host: github
  stack_summary: Django
  ai_plans_dir: ai-plans
commands:
  lint: ruff check
  build: mypy .
  test_unit: pytest
policies:
  pr_creation: agents-create
  ai_coauthor: allowed
  commit_style: conventional
  stage_pattern: git add <paths>
vendors: [claude]
foundation_skills:
  plan-feature: enabled
foundation_agents:
  implementer: enabled
maestro:
  gates:
    codegen:
      cmd: make api_client
