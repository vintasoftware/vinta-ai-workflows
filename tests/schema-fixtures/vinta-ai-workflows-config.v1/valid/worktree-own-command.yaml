# A project that provisions worktrees with its own script instead of the
# prepare-worktree skill: the skill is disabled, the command is set, and
# skills.prepare-worktree carries only the fields the conductor reads.
schema_version: 1
vinta_ai_workflows_version: 0.7.0-alpha25
project:
  name: acme
  default_branch: main
  code_host: github
  stack_summary: pnpm + Vite + React
  ai_plans_dir: ai-plans
commands:
  lint: pnpm lint
  build: pnpm build
  test_unit: pnpm test
  worktree_prepare: ./bin/new-worktree
  worktree_teardown: ./bin/rm-worktree
policies:
  pr_creation: agents-create
  ai_coauthor: allowed
  commit_style: conventional
  stage_pattern: git add <paths>
vendors: [claude]
foundation_skills:
  prepare-worktree: disabled
foundation_agents:
  implementer: enabled
run_options:
  implement-plan:
    use_worktree: true
    parallel_phases: true
skills:
  prepare-worktree:
    worktree_root: .claude/worktrees
    summary_dir: .vinta-ai-workflows/worktrees
