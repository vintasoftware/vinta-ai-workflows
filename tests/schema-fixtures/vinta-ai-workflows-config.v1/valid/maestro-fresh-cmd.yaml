# A test gate whose integration-worktree runs start from a fresh test database
# when the tree moves sideways or one of its migrations is rewritten,
# and whose scoped testmon form falls back to the parallel suite in a cold lane
schema_version: 1
vinta_ai_workflows_version: 0.7.0-alpha25
project:
  name: acme
  default_branch: main
  code_host: github
  stack_summary: Django
  ai_plans_dir: ai-plans
commands:
  lint: ruff check
  build: mypy .
  test_unit: pytest
policies:
  pr_creation: agents-create
  ai_coauthor: allowed
  commit_style: conventional
  stage_pattern: git add <paths>
vendors: [claude]
foundation_skills:
  plan-feature: enabled
foundation_agents:
  implementer: enabled
maestro:
  defaults:
    gates: [typecheck, lint, test, django-check, api-client-fresh]
  gates:
    test:
      cmd: pytest --reuse-db -n auto
      fresh_cmd: pytest --create-db -n auto
      fresh_when: [apps/*/migrations/*.py]
      scoped_cmd: pytest --testmon {changed_files}
      cold_cmd: pytest --reuse-db -n auto
      scope_cache: [.testmondata]
      requires: [test-suite]
    django-check:
      cmd: uv run python manage.py check --fail-level WARNING
    api-client-fresh:
      cmd: make api_client && git diff --exit-code -- frontend/src/api
      requires: [test-suite]
      timeout_s: 600
  post_merge:
    cmd: python -m py_compile {files} && ruff check --fix --select I,F811,F401 {files}
  ci_only:
    - command: pnpm run generate-client
      reason: needs the deployed API schema
  resources:
    test-suite:
      capacity: 1
      kind: semaphore
